---
layout: default
---
<!-- page.html -->
        <div class="post">

          <header class="page-header">
            {%- if page.eyebrow %}
            <p class="eyebrow">{{ page.eyebrow }}</p>
            {%- endif %}
            <h1 class="page-title">{{ page.title }}</h1>
            {%- if page.description %}
            <p class="page-desc">{{ page.description }}</p>
            {%- endif %}
          </header>

          <article class="page-content{% if page.wide %} wide{% endif %}">
            {{ content }}
          </article>

        </div>
